<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMA200 Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .label {
      color: #6b7280;
      font-size: 14px;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small-value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .signal {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      padding: 20px;
      border-radius: 15px;
      margin-top: 10px;
    }

    .invested {
      background: #dcfce7;
      color: #166534;
    }

    .out {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .update {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>SMA200 Dashboard</h1>

  <div class="card">
    <div class="label">S&P 500</div>
    <div class="value" id="price">---</div>
  </div>

  <div class="card">
    <div class="label">SMA200</div>
    <div class="small-value" id="sma">---</div>
  </div>

  <div class="card">
    <div class="label">Abstand zum SMA200</div>
    <div class="small-value" id="distance">---</div>
  </div>

  <div class="card">
    <div class="label">ZahlGraf-Regel</div>
    <div id="signal" class="signal neutral">
      DATEN WERDEN GELADEN
    </div>
  </div>

  <div class="update">
    Letzte Aktualisierung: <span id="updated">---</span>
  </div>

</div>

<script>

  /*
    TESTDATEN

    Diese Werte ersetzen wir im nächsten Schritt
    durch echte S&P-500-Daten.
  */

  const price = 7670.84;
  const sma200 = 7209.41;

  document.getElementById("price").textContent =
    price.toLocaleString("de-DE", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  document.getElementById("sma").textContent =
    sma200.toLocaleString("de-DE", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });

  const distance = ((price - sma200) / sma200) * 100;

  document.getElementById("distance").textContent =
    (distance >= 0 ? "+" : "") +
    distance.toFixed(2) +
    " %";

  const signal = document.getElementById("signal");

  if (price >= sma200) {
    signal.textContent = "🟢 AMUMBO: EIN";
    signal.className = "signal invested";
  } else {
    signal.textContent = "🔴 AMUMBO: AUS";
    signal.className = "signal out";
  }

  document.getElementById("updated").textContent =
    new Date().toLocaleString("de-DE");

</script>

</body>
</html>
