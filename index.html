<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SMA200 Dashboard</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 16px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .label {
      color: #6b7280;
      font-size: 14px;
    }

    .value {
      font-size: 36px;
      font-weight: bold;
      margin-top: 5px;
    }

    .small-value {
      font-size: 24px;
      font-weight: bold;
      margin-top: 5px;
    }

    .signal {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      padding: 20px;
      border-radius: 15px;
      margin-top: 10px;
    }

    .invested {
      background: #dcfce7;
      color: #166534;
    }

    .out {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .update {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>SMA200 Dashboard</h1>

    <div class="card">
      <div class="label">S&P 500 / SPY</div>
      <div class="value" id="price">---</div>
    </div>

    <div class="card">
      <div class="label">SMA200</div>
      <div class="small-value" id="sma">---</div>
    </div>

    <div class="card">
      <div class="label">Abstand zum SMA200</div>
      <div class="small-value" id="distance">---</div>
    </div>

    <div class="card">
      <div class="label">ZahlGraf-Regel</div>

      <div id="signal" class="signal neutral">
        DATEN WERDEN GELADEN
      </div>
    </div>

    <div class="update">
      Letzte Aktualisierung:
      <span id="updated">---</span>
    </div>

  </div>


  <script>

    // ==========================================
    // EINSTELLUNGEN
    // ==========================================

    const API_KEY = "700BBS7NX2KASU5T";
    const SYMBOL = "SPY";


    // ==========================================
    // DATEN LADEN
    // ==========================================

    async function loadData() {

      try {

        // --------------------------------------
        // AKTUELLEN SPY-KURS ABRUFEN
        // --------------------------------------

        const priceUrl =
          "https://www.alphavantage.co/query" +
          "?function=TIME_SERIES_DAILY" +
          "&symbol=" + SYMBOL +
          "&outputsize=compact" +
          "&apikey=" + API_KEY;


        const priceResponse =
          await fetch(priceUrl);


        const priceData =
          await priceResponse.json();


        // API-Fehler prüfen

        if (priceData["Error Message"]) {
          throw new Error(
            "Alpha Vantage: " +
            priceData["Error Message"]
          );
        }


        if (priceData["Note"]) {
          throw new Error(
            "Alpha-Vantage-Limit erreicht. " +
            "Bitte später erneut versuchen."
          );
        }


        // Kursreihe

        const timeSeries =
          priceData["Time Series (Daily)"];


        if (!timeSeries) {
          throw new Error(
            "Keine Kursdaten erhalten."
          );
        }


        // --------------------------------------
        // NEUESTEN HANDELSTAG ERMITTELN
        // --------------------------------------

        const dates =
          Object.keys(timeSeries)
            .sort()
            .reverse();


        const latestDate =
          dates[0];


        const price =
          Number(
            timeSeries[latestDate]["4. close"]
          );


        // --------------------------------------
        // SMA200 ABRUFEN
        // --------------------------------------

        const smaUrl =
          "https://www.alphavantage.co/query" +
          "?function=SMA" +
          "&symbol=" + SYMBOL +
          "&interval=daily" +
          "&time_period=200" +
          "&series_type=close" +
          "&apikey=" + API_KEY;


        const smaResponse =
          await fetch(smaUrl);


        const smaData =
          await smaResponse.json();


        // Fehler prüfen

        if (smaData["Error Message"]) {
          throw new Error(
            "SMA-Fehler: " +
            smaData["Error Message"]
          );
        }


        if (smaData["Note"]) {
          throw new Error(
            "Alpha-Vantage-Limit erreicht."
          );
        }


        // SMA-Daten

        const smaSeries =
          smaData["Technical Analysis: SMA"];


        if (!smaSeries) {
          throw new Error(
            "Keine SMA200-Daten erhalten."
          );
        }


        // --------------------------------------
        // NEUESTEN SMA200 ERMITTELN
        // --------------------------------------

        const smaDates =
          Object.keys(smaSeries)
            .sort()
            .reverse();


        const smaDate =
          smaDates[0];


        const sma200 =
          Number(
            smaSeries[smaDate]["SMA"]
          );


        // --------------------------------------
        // ABSTAND ZUM SMA200
        // --------------------------------------

        const distance =
          ((price - sma200) / sma200) * 100;


        // --------------------------------------
        // KURS ANZEIGEN
        // --------------------------------------

        document.getElementById(
          "price"
        ).textContent =
          price.toLocaleString(
            "de-DE",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );


        // --------------------------------------
        // SMA200 ANZEIGEN
        // --------------------------------------

        document.getElementById(
          "sma"
        ).textContent =
          sma200.toLocaleString(
            "de-DE",
            {
              minimumFractionDigits: 2,
              maximumFractionDigits: 2
            }
          );


        // --------------------------------------
        // ABSTAND ANZEIGEN
        // --------------------------------------

        document.getElementById(
          "distance"
        ).textContent =
          (distance >= 0 ? "+" : "") +
          distance.toFixed(2) +
          " %";


        // --------------------------------------
        // AMUMBO-SIGNAL
        // --------------------------------------

        const signal =
          document.getElementById(
            "signal"
          );


        if (price >= sma200) {

          signal.textContent =
            "🟢 AMUMBO: EIN";

          signal.className =
            "signal invested";

        } else {

          signal.textContent =
            "🔴 AMUMBO: AUS";

          signal.className =
            "signal out";
        }


        // --------------------------------------
        // AKTUALISIERUNG
        // --------------------------------------

        document.getElementById(
          "updated"
        ).textContent =
          "Kurs: " +
          latestDate +
          " | SMA: " +
          smaDate;


      } catch (error) {

        console.error(error);


        // Fehler anzeigen

        const signal =
          document.getElementById(
            "signal"
          );


        signal.textContent =
          "⚠️ DATENFEHLER";


        signal.className =
          "signal neutral";


        document.getElementById(
          "updated"
        ).textContent =
          error.message;
      }

    }


    // ==========================================
    // APP STARTEN
    // ==========================================

    loadData();

  </script>

</body>
</html>
