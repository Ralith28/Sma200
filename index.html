<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SMA200 Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 25px;
      font-size: 34px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .label {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 38px;
      font-weight: bold;
    }

    .small-value {
      font-size: 28px;
      font-weight: bold;
    }

    .signal {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      padding: 20px;
      border-radius: 16px;
      margin-top: 12px;
    }

    .invested {
      background: #dcfce7;
      color: #166534;
    }

    .out {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .update {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .error {
      color: #991b1b;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>SMA200 Dashboard</h1>


    <div class="card">

      <div class="label">
        S&P 500 / SPY
      </div>

      <div
        class="value"
        id="price"
      >
        ...
      </div>

    </div>


    <div class="card">

      <div class="label">
        SMA200
      </div>

      <div
        class="small-value"
        id="sma"
      >
        ...
      </div>

    </div>


    <div class="card">

      <div class="label">
        Abstand zum SMA200
      </div>

      <div
        class="small-value"
        id="distance"
      >
        ...
      </div>

    </div>


    <div class="card">

      <div class="label">
        ZahlGraf-Regel
      </div>

      <div
        id="signal"
        class="signal neutral"
      >
        DATEN WERDEN GELADEN
      </div>

    </div>


    <div class="update">

      Letzte Aktualisierung:

      <br>

      <span id="updated">
        ...
      </span>

      <div
        id="error"
        class="error"
      ></div>

    </div>

  </div>


<script>


// =====================================================
// EINSTELLUNGEN
// =====================================================

const API_KEY =
  "700BBS7NX2KASU5T";

const SYMBOL =
  "SPY";


// =====================================================
// ZAHLEN FORMATIEREN
// =====================================================

function formatNumber(value) {

  return Number(value).toLocaleString(
    "de-DE",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}


// =====================================================
// FEHLER ANZEIGEN
// =====================================================

function showError(message) {

  document.getElementById(
    "signal"
  ).textContent =
    "⚠️ DATENFEHLER";

  document.getElementById(
    "signal"
  ).className =
    "signal neutral";

  document.getElementById(
    "error"
  ).textContent =
    message;

}


// =====================================================
// API ANTWORT PRÜFEN
// =====================================================

function checkApiResponse(data) {

  if (data["Error Message"]) {

    throw new Error(
      data["Error Message"]
    );

  }

  if (data["Note"]) {

    throw new Error(
      "Alpha-Vantage API-Limit erreicht."
    );

  }

}


// =====================================================
// DATEN LADEN
// =====================================================

async function loadData() {

  try {


    // =================================================
    // 1. KURS LADEN
    // =================================================

    const priceUrl =
      "https://www.alphavantage.co/query" +
      "?function=TIME_SERIES_DAILY" +
      "&symbol=" + SYMBOL +
      "&outputsize=compact" +
      "&apikey=" + API_KEY;


    const priceResponse =
      await fetch(priceUrl);


    if (!priceResponse.ok) {

      throw new Error(
        "Kursabruf HTTP-Fehler: " +
        priceResponse.status
      );

    }


    const priceData =
      await priceResponse.json();


    checkApiResponse(
      priceData
    );


    const timeSeries =
      priceData[
        "Time Series (Daily)"
      ];


    if (!timeSeries) {

      throw new Error(
        "Keine SPY-Kursdaten erhalten."
      );

    }


    const dates =
      Object.keys(timeSeries)
        .sort()
        .reverse();


    const latestDate =
      dates[0];


    const price =
      Number(
        timeSeries[
          latestDate
        ]["4. close"]
      );


    // =================================================
    // 2. KURZ PAUSE
    // =================================================

    // Verhindert, dass beide API-Anfragen
    // gleichzeitig rausgehen.

    await new Promise(
      resolve =>
        setTimeout(resolve, 500)
    );


    // =================================================
    // 3. SMA200 LADEN
    // =================================================

    const smaUrl =
      "https://www.alphavantage.co/query" +
      "?function=SMA" +
      "&symbol=" + SYMBOL +
      "&interval=daily" +
      "&time_period=200" +
      "&series_type=close" +
      "&apikey=" + API_KEY;


    const smaResponse =
      await fetch(smaUrl);


    if (!smaResponse.ok) {

      throw new Error(
        "SMA-Abruf HTTP-Fehler: " +
        smaResponse.status
      );

    }


    const smaData =
      await smaResponse.json();


    checkApiResponse(
      smaData
    );


    const smaSeries =
      smaData[
        "Technical Analysis: SMA"
      ];


    if (!smaSeries) {

      throw new Error(
        "Alpha Vantage hat keine SMA200-Daten geliefert."
      );

    }


    const smaDates =
      Object.keys(smaSeries)
        .sort()
        .reverse();


    const smaDate =
      smaDates[0];


    const sma200 =
      Number(
        smaSeries[
          smaDate
        ]["SMA"]
      );


    // =================================================
    // 4. WERTE PRÜFEN
    // =================================================

    if (
      !Number.isFinite(price) ||
      !Number.isFinite(sma200)
    ) {

      throw new Error(
        "Ungültige Kursdaten."
      );

    }


    // =================================================
    // 5. ABSTAND BERECHNEN
    // =================================================

    const distance =
      (
        (price - sma200)
        / sma200
      ) * 100;


    // =================================================
    // 6. ANZEIGE
    // =================================================

    document.getElementById(
      "price"
    ).textContent =
      formatNumber(price);


    document.getElementById(
      "sma"
    ).textContent =
      formatNumber(sma200);


    document.getElementById(
      "distance"
    ).textContent =
      (distance >= 0 ? "+" : "") +
      distance.toFixed(2) +
      " %";


    // =================================================
    // 7. SIGNAL
    // =================================================

    const signal =
      document.getElementById(
        "signal"
      );


    if (price >= sma200) {

      signal.textContent =
        "🟢 AMUMBO: EIN";

      signal.className =
        "signal invested";

    } else {

      signal.textContent =
        "🔴 AMUMBO: AUS";

      signal.className =
        "signal out";

    }


    // =================================================
    // 8. STATUS
    // =================================================

    document.getElementById(
      "updated"
    ).textContent =
      "Kurs: " +
      latestDate +
      " | SMA200: " +
      smaDate;


    document.getElementById(
      "error"
    ).textContent =
      "";


  }

  catch (error) {

    console.error(
      "SMA200 Fehler:",
      error
    );

    showError(
      error.message
    );

  }

}


// =====================================================
// START
// =====================================================

loadData();


</script>

</body>

</html>
