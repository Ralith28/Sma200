<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SMA200 Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 25px 0;
      font-size: 34px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;

      box-shadow:
        0 5px 20px rgba(0, 0, 0, 0.08);
    }

    .label {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 38px;
      font-weight: bold;
    }

    .small-value {
      font-size: 28px;
      font-weight: bold;
    }

    .signal {
      text-align: center;
      font-size: 25px;
      font-weight: bold;

      padding: 20px;

      border-radius: 16px;

      margin-top: 12px;
    }

    .invested {
      background: #dcfce7;
      color: #166534;
    }

    .out {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .update {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .error {
      color: #991b1b;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }

  </style>

</head>


<body>


  <div class="container">


    <h1>SMA200 Dashboard</h1>


    <!-- AKTUELLER KURS -->

    <div class="card">

      <div class="label">
        S&P 500 / SPY
      </div>

      <div
        class="value"
        id="price"
      >
        ...
      </div>

    </div>


    <!-- SMA200 -->

    <div class="card">

      <div class="label">
        SMA200
      </div>

      <div
        class="small-value"
        id="sma"
      >
        ...
      </div>

    </div>


    <!-- ABSTAND -->

    <div class="card">

      <div class="label">
        Abstand zum SMA200
      </div>

      <div
        class="small-value"
        id="distance"
      >
        ...
      </div>

    </div>


    <!-- SIGNAL -->

    <div class="card">

      <div class="label">
        ZahlGraf-Regel
      </div>

      <div
        id="signal"
        class="signal neutral"
      >
        DATEN WERDEN GELADEN
      </div>

    </div>


    <!-- STATUS -->

    <div class="update">

      Letzte Aktualisierung:<br>

      <span id="updated">
        ...
      </span>

      <div
        id="error"
        class="error"
      ></div>

    </div>


  </div>



  <script>


    // =====================================================
    // EINSTELLUNGEN
    // =====================================================

    const API_KEY =
      "700BBS7NX2KASU5T";

    const SYMBOL =
      "SPY";


    // =====================================================
    // HILFSFUNKTION
    // =====================================================

    function formatNumber(value) {

      return Number(value).toLocaleString(
        "de-DE",
        {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }
      );

    }


    // =====================================================
    // FEHLER ANZEIGEN
    // =====================================================

    function showError(message) {

      document.getElementById(
        "signal"
      ).textContent =
        "⚠️ DATENFEHLER";


      document.getElementById(
        "signal"
      ).className =
        "signal neutral";


      document.getElementById(
        "error"
      ).textContent =
        message;

    }


    // =====================================================
    // DATEN LADEN
    // =====================================================

    async function loadData() {


      try {


        // -------------------------------------------------
        // 1. AKTUELLEN SPY-KURS HOLEN
        // -------------------------------------------------

        const priceUrl =
          "https://www.alphavantage.co/query" +
          "?function=TIME_SERIES_DAILY" +
          "&symbol=" + SYMBOL +
          "&outputsize=compact" +
          "&apikey=" + API_KEY;


        const priceResponse =
          await fetch(priceUrl);


        if (!priceResponse.ok) {

          throw new Error(
            "HTTP-Fehler beim Kursabruf: " +
            priceResponse.status
          );

        }


        const priceData =
          await priceResponse.json();


        // -------------------------------------------------
        // API FEHLER PRÜFEN
        // -------------------------------------------------

        if (
          priceData["Error Message"]
        ) {

          throw new Error(
            priceData["Error Message"]
          );

        }


        if (
          priceData["Note"]
        ) {

          throw new Error(
            "Alpha-Vantage API-Limit erreicht."
          );

        }


        const timeSeries =
          priceData[
            "Time Series (Daily)"
          ];


        if (!timeSeries) {

          throw new Error(
            "Alpha Vantage hat keine Kursdaten geliefert."
          );

        }


        // -------------------------------------------------
        // NEUESTEN HANDELSTAG FINDEN
        // -------------------------------------------------

        const dates =
          Object.keys(timeSeries)
            .sort()
            .reverse();


        const latestDate =
          dates[0];


        const price =
          Number(
            timeSeries[
              latestDate
            ]["4. close"]
          );


        // -------------------------------------------------
        // 2. SMA200 HOLEN
        // -------------------------------------------------

        const smaUrl =
          "https://www.alphavantage.co/query" +
          "?function=SMA" +
          "&symbol=" + SYMBOL +
          "&interval=daily" +
          "&time_period=200" +
          "&series_type=close" +
          "&apikey=" + API_KEY;


        const smaResponse =
          await fetch(smaUrl);


        if (!smaResponse.ok) {

          throw new Error(
            "HTTP-Fehler beim SMA-Abruf: " +
            smaResponse.status
          );

        }


        const smaData =
          await smaResponse.json();


        // -------------------------------------------------
        // SMA FEHLER PRÜFEN
        // -------------------------------------------------

        if (
          smaData["Error Message"]
        ) {

          throw new Error(
            smaData["Error Message"]
          );

        }


        if (
          smaData["Note"]
        ) {

          throw new Error(
            "Alpha-Vantage API-Limit erreicht."
          );

        }


        const smaSeries =
          smaData[
            "Technical Analysis: SMA"
          ];


        if (!smaSeries) {

          throw new Error(
            "Alpha Vantage hat keine SMA200-Daten geliefert."
          );

        }


        // -------------------------------------------------
        // NEUESTEN SMA200 FINDEN
        // -------------------------------------------------

        const smaDates =
          Object.keys(smaSeries)
            .sort()
            .reverse();


        const smaDate =
          smaDates[0];


        const sma200 =
          Number(
            smaSeries[
              smaDate
            ]["SMA"]
          );


        // -------------------------------------------------
        // WERTE PRÜFEN
        // -------------------------------------------------

        if (
          !Number.isFinite(price) ||
          !Number.isFinite(sma200)
        ) {

          throw new Error(
            "Ungültige Kurs- oder SMA-Daten."
          );

        }


        // -------------------------------------------------
        // ABSTAND BERECHNEN
        // -------------------------------------------------

        const distance =
          (
            (price - sma200)
            / sma200
          ) * 100;


        // -------------------------------------------------
        // KURS ANZEIGEN
        // -------------------------------------------------

        document.getElementById(
          "price"
        ).textContent =
          formatNumber(price);


        // -------------------------------------------------
        // SMA200 ANZEIGEN
        // -------------------------------------------------

        document.getElementById(
          "sma"
        ).textContent =
          formatNumber(sma200);


        // -------------------------------------------------
        // ABSTAND ANZEIGEN
        // -------------------------------------------------

        document.getElementById(
          "distance"
        ).textContent =
          (
            distance >= 0
              ? "+"
              : ""
          ) +
          distance.toFixed(2) +
          " %";


        // -------------------------------------------------
        // SIGNAL
        // -------------------------------------------------

        const signal =
          document.getElementById(
            "signal"
          );


        if (
          price >= sma200
        ) {

          signal.textContent =
            "🟢 AMUMBO: EIN";

          signal.className =
            "signal invested";

        } else {

          signal.textContent =
            "🔴 AMUMBO: AUS";

          signal.className =
            "signal out";

        }


        // -------------------------------------------------
        // AKTUALISIERUNG
        // -------------------------------------------------

        document.getElementById(
          "updated"
        ).textContent =
          "Kurs: " +
          latestDate +
          " | SMA200: " +
          smaDate;


        document.getElementById(
          "error"
        ).textContent =
          "";


      }


      catch (error) {


        console.error(
          "SMA200 Fehler:",
          error
        );


        showError(
          error.message
        );


      }

    }


    // =====================================================
    // APP STARTEN
    // =====================================================

    loadData();


  </script>


</body>

</html>
