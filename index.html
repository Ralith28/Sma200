<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>SMA200 Dashboard</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 700px;
      margin: auto;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 25px;
      font-size: 34px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    .label {
      color: #6b7280;
      font-size: 17px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 38px;
      font-weight: bold;
    }

    .small-value {
      font-size: 28px;
      font-weight: bold;
    }

    .signal {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      padding: 20px;
      border-radius: 16px;
      margin-top: 12px;
    }

    .invested {
      background: #dcfce7;
      color: #166534;
    }

    .out {
      background: #fee2e2;
      color: #991b1b;
    }

    .neutral {
      background: #e5e7eb;
      color: #374151;
    }

    .chart-card {
      padding-bottom: 18px;
    }

    .chart-wrapper {
      width: 100%;
      overflow: hidden;
    }

    canvas {
      display: block;
      width: 100%;
      height: 300px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 12px;
      font-size: 14px;
      color: #6b7280;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .price-dot {
      background: #111827;
    }

    .sma-dot {
      background: #2563eb;
    }

    .update {
      text-align: center;
      color: #6b7280;
      font-size: 13px;
      margin-top: 20px;
      line-height: 1.5;
    }

    .error {
      color: #991b1b;
      font-size: 14px;
      margin-top: 10px;
      text-align: center;
    }

  </style>

</head>


<body>

  <div class="container">

    <h1>SMA200 Dashboard</h1>


    <div class="card">

      <div class="label">
        S&P 500 / SPY
      </div>

      <div
        class="value"
        id="price"
      >
        ...
      </div>

    </div>


    <div class="card">

      <div class="label">
        SMA200
      </div>

      <div
        class="small-value"
        id="sma"
      >
        ...
      </div>

    </div>


    <div class="card">

      <div class="label">
        Abstand zum SMA200
      </div>

      <div
        class="small-value"
        id="distance"
      >
        ...
      </div>

    </div>


    <div class="card">

      <div class="label">
        ZahlGraf-Regel
      </div>

      <div
        id="signal"
        class="signal neutral"
      >
        DATEN WERDEN GELADEN
      </div>

    </div>


    <!-- ============================= -->
    <!-- VERLAUF -->
    <!-- ============================= -->

    <div class="card chart-card">

      <div class="label">
        Verlauf SPY / SMA200
      </div>

      <div class="chart-wrapper">

        <canvas id="chart"></canvas>

      </div>

      <div class="legend">

        <span>
          <span class="dot price-dot"></span>
          SPY
        </span>

        <span>
          <span class="dot sma-dot"></span>
          SMA200
        </span>

      </div>

    </div>


    <div class="update">

      Letzte Aktualisierung:

      <br>

      <span id="updated">
        ...
      </span>

      <div
        id="error"
        class="error"
      ></div>

    </div>

  </div>


<script>


// =====================================================
// EINSTELLUNGEN
// =====================================================

const API_KEY =
  "700BBS7NX2KASU5T";

const SYMBOL =
  "SPY";


// =====================================================
// ZAHL FORMATIEREN
// =====================================================

function formatNumber(value) {

  return Number(value).toLocaleString(
    "de-DE",
    {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    }
  );

}


// =====================================================
// FEHLER
// =====================================================

function showError(message) {

  document.getElementById(
    "signal"
  ).textContent =
    "⚠️ DATENFEHLER";

  document.getElementById(
    "signal"
  ).className =
    "signal neutral";

  document.getElementById(
    "error"
  ).textContent =
    message;

}


// =====================================================
// API ANTWORT PRÜFEN
// =====================================================

function checkApiResponse(data) {

  if (data["Error Message"]) {

    throw new Error(
      data["Error Message"]
    );

  }

  if (data["Note"]) {

    throw new Error(
      "Alpha-Vantage API-Limit erreicht."
    );

  }

}


// =====================================================
// CHART ZEICHNEN
// =====================================================

function drawChart(priceData, smaData) {

  const canvas =
    document.getElementById("chart");

  const ctx =
    canvas.getContext("2d");


  // ---------------------------------------------------
  // Größe
  // ---------------------------------------------------

  const width =
    canvas.clientWidth;

  const height =
    300;


  const pixelRatio =
    window.devicePixelRatio || 1;


  canvas.width =
    width * pixelRatio;

  canvas.height =
    height * pixelRatio;


  ctx.scale(
    pixelRatio,
    pixelRatio
  );


  // ---------------------------------------------------
  // Letzte 60 gemeinsamen Handelstage
  // ---------------------------------------------------

  const dates =
    Object.keys(smaData)
      .filter(date =>
        priceData[date]
      )
      .sort()
      .slice(-60);


  if (dates.length < 2) {

    return;

  }


  const prices =
    dates.map(date =>
      Number(
        priceData[date]["4. close"]
      )
    );


  const smas =
    dates.map(date =>
      Number(
        smaData[date]["SMA"]
      )
    );


  // ---------------------------------------------------
  // Wertebereich
  // ---------------------------------------------------

  const allValues =
    prices.concat(smas);


  let min =
    Math.min(...allValues);

  let max =
    Math.max(...allValues);


  const padding =
    (max - min) * 0.10;


  min -= padding;
  max += padding;


  // ---------------------------------------------------
  // Zeichenbereich
  // ---------------------------------------------------

  const left =
    42;

  const right =
    12;

  const top =
    15;

  const bottom =
    30;


  const chartWidth =
    width - left - right;

  const chartHeight =
    height - top - bottom;


  // ---------------------------------------------------
  // Hintergrund
  // ---------------------------------------------------

  ctx.clearRect(
    0,
    0,
    width,
    height
  );


  // ---------------------------------------------------
  // Horizontale Linien
  // ---------------------------------------------------

  ctx.strokeStyle =
    "#e5e7eb";

  ctx.lineWidth =
    1;


  for (
    let i = 0;
    i <= 4;
    i++
  ) {

    const y =
      top +
      (chartHeight / 4) * i;


    ctx.beginPath();

    ctx.moveTo(
      left,
      y
    );

    ctx.lineTo(
      width - right,
      y
    );

    ctx.stroke();


    const value =
      max -
      ((max - min) / 4) * i;


    ctx.fillStyle =
      "#9ca3af";

    ctx.font =
      "11px Arial";

    ctx.textAlign =
      "right";

    ctx.fillText(
      value.toFixed(0),
      left - 6,
      y + 4
    );

  }


  // ---------------------------------------------------
  // Funktion für Y
  // ---------------------------------------------------

  function yPosition(value) {

    return (
      top +
      (
        (max - value)
        /
        (max - min)
      )
      *
      chartHeight
    );

  }


  // ---------------------------------------------------
  // Funktion für X
  // ---------------------------------------------------

  function xPosition(index) {

    return (
      left +
      (
        index /
        (dates.length - 1)
      )
      *
      chartWidth
    );

  }


  // ---------------------------------------------------
  // SPY-Linie
  // ---------------------------------------------------

  ctx.strokeStyle =
    "#111827";

  ctx.lineWidth =
    2.5;

  ctx.beginPath();


  prices.forEach(
    (value, index) => {

      const x =
        xPosition(index);

      const y =
        yPosition(value);


      if (index === 0) {

        ctx.moveTo(
          x,
          y
        );

      } else {

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.stroke();


  // ---------------------------------------------------
  // SMA200-Linie
  // ---------------------------------------------------

  ctx.strokeStyle =
    "#2563eb";

  ctx.lineWidth =
    2.5;

  ctx.beginPath();


  smas.forEach(
    (value, index) => {

      const x =
        xPosition(index);

      const y =
        yPosition(value);


      if (index === 0) {

        ctx.moveTo(
          x,
          y
        );

      } else {

        ctx.lineTo(
          x,
          y
        );

      }

    }
  );


  ctx.stroke();


  // ---------------------------------------------------
  // Datum links / rechts
  // ---------------------------------------------------

  ctx.fillStyle =
    "#9ca3af";

  ctx.font =
    "10px Arial";

  ctx.textAlign =
    "left";

  ctx.fillText(
    dates[0],
    left,
    height - 8
  );


  ctx.textAlign =
    "right";

  ctx.fillText(
    dates[dates.length - 1],
    width - right,
    height - 8
  );

}


// =====================================================
// DATEN LADEN
// =====================================================

async function loadData() {

  try {


    // =================================================
    // KURSE
    // =================================================

    const priceUrl =
      "https://www.alphavantage.co/query" +
      "?function=TIME_SERIES_DAILY" +
      "&symbol=" + SYMBOL +
      "&outputsize=compact" +
      "&apikey=" + API_KEY;


    const priceResponse =
      await fetch(priceUrl);


    if (!priceResponse.ok) {

      throw new Error(
        "Kursabruf HTTP-Fehler: " +
        priceResponse.status
      );

    }


    const priceData =
      await priceResponse.json();


    checkApiResponse(
      priceData
    );


    const timeSeries =
      priceData[
        "Time Series (Daily)"
      ];


    if (!timeSeries) {

      throw new Error(
        "Keine SPY-Kursdaten erhalten."
      );

    }


    const dates =
      Object.keys(timeSeries)
        .sort()
        .reverse();


    const latestDate =
      dates[0];


    const price =
      Number(
        timeSeries[
          latestDate
        ]["4. close"]
      );


    // =================================================
    // KURZE PAUSE
    // =================================================

    await new Promise(
      resolve =>
        setTimeout(
          resolve,
          500
        )
    );


    // =================================================
    // SMA200
    // =================================================

    const smaUrl =
      "https://www.alphavantage.co/query" +
      "?function=SMA" +
      "&symbol=" + SYMBOL +
      "&interval=daily" +
      "&time_period=200" +
      "&series_type=close" +
      "&apikey=" + API_KEY;


    const smaResponse =
      await fetch(smaUrl);


    if (!smaResponse.ok) {

      throw new Error(
        "SMA-Abruf HTTP-Fehler: " +
        smaResponse.status
      );

    }


    const smaData =
      await smaResponse.json();


    checkApiResponse(
      smaData
    );


    const smaSeries =
      smaData[
        "Technical Analysis: SMA"
      ];


    if (!smaSeries) {

      throw new Error(
        "Keine SMA200-Daten erhalten."
      );

    }


    const smaDates =
      Object.keys(smaSeries)
        .sort()
        .reverse();


    const smaDate =
      smaDates[0];


    const sma200 =
      Number(
        smaSeries[
          smaDate
        ]["SMA"]
      );


    // =================================================
    // BERECHNUNG
    // =================================================

    const distance =
      (
        (price - sma200)
        / sma200
      ) * 100;


    // =================================================
    // HAUPTWERTE
    // =================================================

    document.getElementById(
      "price"
    ).textContent =
      formatNumber(price);


    document.getElementById(
      "sma"
    ).textContent =
      formatNumber(sma200);


    document.getElementById(
      "distance"
    ).textContent =
      (distance >= 0 ? "+" : "") +
      distance.toFixed(2) +
      " %";


    // =================================================
    // SIGNAL
    // =================================================

    const signal =
      document.getElementById(
        "signal"
      );


    if (price >= sma200) {

      signal.textContent =
        "🟢 AMUMBO: EIN";

      signal.className =
        "signal invested";

    } else {

      signal.textContent =
        "🔴 AMUMBO: AUS";

      signal.className =
        "signal out";

    }


    // =================================================
    // CHART
    // =================================================

    drawChart(
      timeSeries,
      smaSeries
    );


    // =================================================
    // STATUS
    // =================================================

    document.getElementById(
      "updated"
    ).textContent =
      "Kurs: " +
      latestDate +
      " | SMA200: " +
      smaDate;


    document.getElementById(
      "error"
    ).textContent =
      "";


  }

  catch (error) {

    console.error(
      "SMA200 Fehler:",
      error
    );

    showError(
      error.message
    );

  }

}


// =====================================================
// START
// =====================================================

loadData();


// =====================================================
// CHART BEI DREHUNG NEU ZEICHNEN
// =====================================================

window.addEventListener(
  "resize",
  () => {
    loadData();
  }
);


</script>

</body>

</html>
